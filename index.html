<!doctype html>
<html lang="en" data-theme="dark" data-width="normal" data-anim="on" data-spot="on" class="js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Snowman — QA testing, moderation and server management portfolio">
<title>Snowman — Portfolio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="bar" hidden></div>
  <nav id="nav" aria-label="Main navigation"></nav>
  <main id="app" role="main"></main>

  <!-- hidden inputs used by the editor -->
  <input id="imgf" type="file" accept="image/*" hidden>
  <input id="imp" type="file" accept="application/json,.json" hidden>
  <input id="fontf" type="file" accept="font/woff2,font/woff,font/ttf" hidden>

  <div id="toast" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
